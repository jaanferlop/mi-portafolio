<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 360" width="340" height="360" role="img" aria-labelledby="lupoTitulo lupoDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="lupoTitulo">Lupo</title>
  <desc id="lupoDesc">Búho mascota de AudiLab sosteniendo una lupa. Parpadea y se mece suavemente.</desc>

  <!--
    Lupo — mascota de AudiLab
    Paleta:  #35797C cuerpo · #2A6467 alas y penachos · #F0E4CE pecho · #E8A33D dorado
    Animación de reposo: parpadeo cada ~4.5s y balanceo suave. Las reacciones
    puntuales (ojos abiertos al acertar, parpadeo lento al fallar) se agregan
    después desde el código, no aquí.
  -->

  <g>
    <!-- balanceo suave de todo el personaje -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -7; 0 0" dur="3.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- penachos -->
    <path d="M98 128 L112 76 L148 108 Z" fill="#2A6467"/>
    <path d="M242 128 L228 76 L192 108 Z" fill="#2A6467"/>

    <!-- cuerpo, alas y pecho -->
    <ellipse cx="170" cy="205" rx="98" ry="100" fill="#35797C"/>
    <ellipse cx="82" cy="215" rx="30" ry="62" fill="#2A6467"/>
    <ellipse cx="258" cy="215" rx="30" ry="62" fill="#2A6467"/>
    <ellipse cx="170" cy="238" rx="62" ry="66" fill="#F0E4CE"/>

    <!-- ojos: el parpadeo reduce el radio vertical casi a cero -->
    <ellipse cx="138" cy="182" rx="34" ry="34" fill="#FFFFFF" stroke="#22585B" stroke-width="3">
      <animate attributeName="ry" values="34;34;34;34;34;34;34;2;34;34;34;34" dur="4.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="202" cy="182" rx="34" ry="34" fill="#FFFFFF" stroke="#22585B" stroke-width="3">
      <animate attributeName="ry" values="34;34;34;34;34;34;34;2;34;34;34;34" dur="4.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="142" cy="184" rx="15" ry="15" fill="#1C3F42">
      <animate attributeName="ry" values="15;15;15;15;15;15;15;1;15;15;15;15" dur="4.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="198" cy="184" rx="15" ry="15" fill="#1C3F42">
      <animate attributeName="ry" values="15;15;15;15;15;15;15;1;15;15;15;15" dur="4.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- pico -->
    <path d="M170 206 L184 222 L170 238 L156 222 Z" fill="#E8A33D"/>

    <!-- patas -->
    <path d="M130 300 L130 316 M150 300 L150 316" stroke="#E8A33D" stroke-width="9" stroke-linecap="round"/>
    <path d="M190 300 L190 316 M210 300 L210 316" stroke="#E8A33D" stroke-width="9" stroke-linecap="round"/>

    <!-- lupa: se desplaza como si revisara algo -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 26 14; 0 0; -18 10; 0 0" dur="5s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <line x1="282" y1="262" x2="316" y2="302" stroke="#C7791F" stroke-width="14" stroke-linecap="round"/>
      <circle cx="262" cy="240" r="36" fill="#BBD9DA" fill-opacity="0.55"/>
      <circle cx="262" cy="240" r="36" fill="none" stroke="#E8A33D" stroke-width="9"/>
      <path d="M244 226 L254 216" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
    </g>
  </g>
</svg>
